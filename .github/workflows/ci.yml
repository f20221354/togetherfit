name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  api:
    name: API tests (real build, Postgres, fake mail)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: togetherfit
          POSTGRES_PASSWORD: togetherfit
          POSTGRES_DB: togetherfit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U togetherfit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://togetherfit:togetherfit@localhost:5432/togetherfit_test
      TEST_DATABASE_URL: postgres://togetherfit:togetherfit@localhost:5432/togetherfit_test
      DATABASE_SSL: "false"
      TEST_MAIL_LOG: /tmp/mail.log
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run build
      - name: Start fake mail server and app
        run: |
          node tests/support/smtp-sink.mjs 2465 "$TEST_MAIL_LOG" &
          AUTH_SECRET=ci-auth-secret-0123456789abcdef0123456789 \
          SMTP_HOST=127.0.0.1 SMTP_PORT=2465 SMTP_SECURE=true SMTP_USER=noreply@example.com SMTP_PASS=x \
          NODE_TLS_REJECT_UNAUTHORIZED=0 VERIFICATION=mock CRON_SECRET=ci-cron-secret \
          npx next start -p 3100 > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/login && break; sleep 1; done
      - run: npm run test:api
      - name: Realtime stream tests (second app with REALTIME=sse)
        run: |
          AUTH_SECRET=ci-auth-secret-0123456789abcdef0123456789 \
          SMTP_HOST=127.0.0.1 SMTP_PORT=2465 SMTP_SECURE=true SMTP_USER=noreply@example.com SMTP_PASS=x \
          NODE_TLS_REJECT_UNAUTHORIZED=0 VERIFICATION=mock CRON_SECRET=ci-cron-secret REALTIME=sse \
          npx next start -p 3101 > /tmp/app-sse.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3101/login && break; sleep 1; done
          TEST_BASE_URL=http://localhost:3101 TEST_REALTIME=sse npx vitest run --project api tests/api/realtime.test.ts
      - name: App logs on failure
        if: failure()
        run: tail -100 /tmp/app.log; tail -50 /tmp/app-sse.log || true
